<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="zkGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00f5ff" />
      <stop offset="45%" stopColor="#6366f1" />
      <stop offset="85%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#ec4899" />
    </linearGradient>
    <linearGradient id="zkGradInner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#1e1b4b" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#090d1f" stopOpacity="0.98" />
    </linearGradient>
    <linearGradient id="zkGradAccent" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#00f5ff" />
      <stop offset="100%" stopColor="#c084fc" />
    </linearGradient>
    <filter id="zkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cryptographic Hex-Shield -->
  <path
    d="M50 4 L86 22 L86 60 C86 78 50 96 50 96 C50 96 14 78 14 60 L14 22 Z"
    fill="url(#zkGradInner)"
    stroke="url(#zkGradPrimary)"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Midnight Crescent Moon Arc -->
  <path
    d="M32 26 C22 36 22 62 34 74 C26 66 25 42 32 26 Z"
    fill="url(#zkGradAccent)"
    fill-opacity="0.8"
  />

  <!-- Academic Scholar Mortarboard -->
  <g transform="translate(0, 2)">
    <path
      d="M50 21 L74 32 L50 43 L26 32 Z"
      fill="url(#zkGradAccent)"
      fill-opacity="0.25"
      stroke="url(#zkGradPrimary)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
    <path
      d="M36 37 L36 47 C36 51 64 51 64 47 L64 37"
      fill="none"
      stroke="url(#zkGradAccent)"
      stroke-width="2"
      stroke-linecap="round"
    />
    <path
      d="M50 32 Q72 34 74 46"
      fill="none"
      stroke="#00f5ff"
      stroke-width="1.8"
      stroke-linecap="round"
    />
    <circle cx="74" cy="48" r="2.2" fill="#00f5ff" />
  </g>

  <!-- Zero-Knowledge Nexus -->
  <g transform="translate(0, 10)">
    <polygon
      points="50,46 62,56 50,66 38,56"
      fill="url(#zkGradPrimary)"
    />
    <circle cx="50" cy="56" r="3" fill="#ffffff" filter="url(#zkGlow)" />
    <path
      d="M50 66 L50 78"
      stroke="#00f5ff"
      stroke-width="2"
      stroke-linecap="round"
      stroke-dasharray="2 3"
    />
    <path
      d="M38 56 L24 56"
      stroke="#6366f1"
      stroke-width="1.8"
      stroke-linecap="round"
    />
    <path
      d="M62 56 L76 56"
      stroke="#a855f7"
      stroke-width="1.8"
      stroke-linecap="round"
    />
    <circle cx="50" cy="78" r="2" fill="#00f5ff" />
    <circle cx="24" cy="56" r="2" fill="#6366f1" />
    <circle cx="76" cy="56" r="2" fill="#a855f7" />
  </g>
</svg>
