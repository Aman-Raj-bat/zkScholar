name: Security Scan
on:
  push: { branches: [main] }
  schedule:
    - cron: '0 2 * * 1'
permissions: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dependency audit
        run: yarn audit --level moderate || true
