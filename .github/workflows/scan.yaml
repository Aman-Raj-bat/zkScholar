name: Security Scan
on:
  push: { branches: [main] }
  schedule:
    - cron: '0 2 * * 1'
permissions: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Dependency audit
        run: yarn audit --level moderate || true
